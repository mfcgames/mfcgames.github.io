<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slidora</title>
<style>
  :root { --bg:#f6f7fb; --text:#1d2033; --muted:#5b6078; --accent:#5c6cff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14162a; --text:#eef0ff; --muted:#a6abc8; --accent:#8f9bff; } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; text-align:center; }
  img { width:128px; height:128px; border-radius:28px; }
  h1 { font-size:40px; margin:16px 0 4px; } p { color:var(--muted); } a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Slidora app icon">
  <h1>Slidora</h1>
  <p>Slide rows and columns, spell hidden words. A word puzzle for all ages in 10 languages.</p>
  <p><a href="privacy.html">Privacy Policy / Gizlilik Politikası</a></p>
  <p>Support / Destek: mfcgamesnet@gmail.com</p>
</main>
</body>
</html>
